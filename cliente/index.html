<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151D2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Pedido">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="../assets/dc-logo-160.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mi Pedido DC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app móvil del cliente. Entrada con nombre → "Mis pedidos" → seguimiento de cada pedido.
   Banda marina con la ruta del paquete arriba, hoja clara con el detalle abajo. */
:root{
  /* Azul marino apagado (no eléctrico), hoja beige, bandejas negras con letras blancas, dorado del logo */
  --navy:#151D2E; --navy-2:#222B3F; --navy-3:#3A4660;
  --signal:#D7A95B;  /* dorado del logo DC Marketing */ --steel:#4B4C4E;
  --paper:#F2ECE1; --card:#0B0C10; --card-ink:#F5F2EC; --card-mute:#A3A9B6; --ink:#151D2E; --muted:#61677A; --line:#E0D8C8;
  --ok:#17905E;
  --f-display:"Unbounded",system-ui,sans-serif; --f-body:"Figtree",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
/* Variables que cambian con el tema (claro) */
:root{--tabs:#E6DDCC;--empty:#FBF8F2;--empty-line:#D3C9B4;--link:var(--navy-3);--ind:var(--card);--ind-ink:var(--card-ink);--done-n:var(--navy)}
/* Modo oscuro (el principal): hoja oscura, tarjetas que resaltan y letras claras */
:root:not([data-tema="claro"]){--paper:#0D121D;--ink:#EEF0F5;--muted:#9AA3B6;--line:#273047;--card:#182134;--card-ink:#F5F2EC;--card-mute:#A9B1C3;--navy-3:#6C7C9E;
  --tabs:#161E2F;--empty:#121A29;--empty-line:#2C3650;--link:#C9CEDA;--ind:var(--signal);--ind-ink:#1A1205;--done-n:#33415F;color-scheme:dark}
:root:not([data-tema="claro"]) .sheet{box-shadow:0 -1px 0 rgba(255,255,255,.07)}
:root:not([data-tema="claro"]) .ocard,:root:not([data-tema="claro"]) .pcard,:root:not([data-tema="claro"]) .resumen,:root:not([data-tema="claro"]) .contact,:root:not([data-tema="claro"]) .tip{border:1px solid #26304A}
:root:not([data-tema="claro"]) .encargo{background:rgba(215,169,91,.12);color:var(--ink)}
:root:not([data-tema="claro"]) .encargo svg{color:var(--signal)}
:root:not([data-tema="claro"]) .now .t::after{background:var(--signal);color:#1A1205}
:root:not([data-tema="claro"]) .empty-c svg{color:#7C8BAA}
html,body{background:var(--navy)}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.grid-bg::after{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 70% at 110% -10%,rgba(215,169,91,.18),transparent 60%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 34px);pointer-events:none}

/* Banda superior */
.hero{color:#fff;padding-block:18px 8px;position:relative;overflow:hidden}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.04em}
.mark img{width:30px;height:auto;display:block}
.code-chip{font-family:var(--f-mono);font-size:12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 11px;background:none;color:#fff;cursor:pointer;white-space:nowrap}
.greet{position:relative;z-index:1;margin-top:26px}
.greet p{margin:0;color:rgba(255,255,255,.7);font-size:14px}
.greet h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,8vw,34px);line-height:1.05;margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
.greet h1 em,.welcome h1 em{font-style:normal;color:var(--signal)}
.last{margin-top:10px;font-size:13px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 0 rgba(215,169,91,.6)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:p 1.8s infinite}@keyframes p{70%{box-shadow:0 0 0 10px rgba(215,169,91,0)}100%{box-shadow:0 0 0 0 rgba(215,169,91,0)}}}

/* Ruta */
.route{position:relative;z-index:1;margin:18px 0 0}
.route svg,.launch svg{width:100%;height:auto;display:block;overflow:visible}
.route .lbl{font-family:var(--f-body);font-size:11px;font-weight:600;fill:rgba(255,255,255,.55);letter-spacing:.04em}
.route .lbl.on{fill:#fff}

/* Hoja */
.sheet{background:var(--paper);border-radius:26px 26px 0 0;flex:1;padding-block:22px 40px;margin-top:6px;display:grid;gap:22px;align-content:start}
.sheet>*{min-width:0}
@media (prefers-reduced-motion:no-preference){.rise .sheet{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}.rise .greet{animation:rise .5s .05s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(36px)}}}
.sec-t{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:10px 0;position:relative}
.steps li:not(:last-child)::after{content:"";position:absolute;left:13px;top:34px;bottom:-10px;width:2px;background:var(--line)}
.steps li.done:not(:last-child)::after{background:var(--navy-3)}
.n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--line);color:var(--muted);background:var(--paper);box-sizing:border-box;position:relative;z-index:1}
.done .n{background:var(--done-n);border-color:var(--done-n);color:#fff}
.now .n{background:var(--signal);border-color:var(--signal);color:var(--navy)}
.steps .t{font-weight:600;line-height:1.3;padding-top:3px}
.steps .h{font-size:13px;color:var(--muted)}
.steps li:not(.done):not(.now) .t{color:var(--muted);font-weight:500}
.steps .when{font-size:12px;color:var(--muted);padding-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.now .t::after{content:var(--t-ahora,"Ahora");margin-left:8px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--navy);color:var(--signal);padding:2px 7px;border-radius:999px;vertical-align:2px}
.delivered .now .t::after{content:var(--t-listo,"Listo");color:#fff;background:var(--ok)}

.contact{background:var(--card);color:var(--card-ink);border-radius:18px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.av{grid-row:span 2;width:46px;height:46px;border-radius:14px;background:var(--navy-2);color:var(--signal);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.contact b{font-size:15px}
.contact .num{font-family:var(--f-mono);font-size:14px;color:var(--card-mute);display:flex;align-items:center}
.contact .row{grid-column:1/-1;display:flex;gap:8px;margin-top:10px}
.btn{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:6px;border:0;border-radius:12px;padding:12px;font:700 14px var(--f-body);cursor:pointer;text-decoration:none}
.btn.wa{background:var(--signal);color:#1A1205}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:focus-visible,.code-chip:focus-visible,input:focus-visible,.ocard:focus-visible,.go-btn:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* Bienvenida: entrar con nombre y apellido */
.welcome{color:#fff;min-height:100vh;min-height:100svh;box-sizing:border-box;display:flex;flex-direction:column;padding-block:28px 32px;position:relative;overflow:hidden}
.w-copy,.w-form{position:relative;z-index:1}
.welcome .mark img{width:40px}
.welcome h1{font:800 clamp(30px,9vw,38px)/1.06 var(--f-display);margin:44px 0 12px;letter-spacing:-.01em;text-wrap:balance}
.welcome .sub{color:rgba(255,255,255,.75);margin:0;max-width:30ch}
.w-form{margin-top:auto;padding-top:36px;display:grid;gap:14px}
.fld{display:grid;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.fld input{font:600 18px var(--f-body);color:#fff;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.22);border-radius:14px;padding:14px 16px;width:100%;box-sizing:border-box;letter-spacing:0;text-transform:none;transition:border-color .2s,background .2s}
.fld input:focus{border-color:var(--signal);background:rgba(255,255,255,.1);outline:none}
.fld input::placeholder{color:rgba(255,255,255,.35)}
.go-btn{margin-top:6px;display:flex;justify-content:center;align-items:center;gap:10px;background:var(--signal);color:var(--navy);font:800 16px var(--f-display);letter-spacing:.02em;padding:17px;border-radius:16px;border:0;cursor:pointer;transition:transform .15s}
.go-btn:active{transform:scale(.98)}
.go-btn svg{width:20px;height:20px}
.invite{background:rgba(215,169,91,.14);border:1px solid rgba(215,169,91,.4);border-radius:14px;padding:12px 14px;font-size:14px;color:#fff}
.w-alt{text-align:center;font-size:13px;color:rgba(255,255,255,.6);margin:4px 0 0}
.w-alt a{color:#fff}
.err{color:var(--signal);font-size:14px;margin:0}
/* Animación de "Iniciar": el formulario baja, el paquete recorre la ruta y aparece el saludo */
.launch{position:absolute;inset:0;z-index:2;display:grid;align-content:center;gap:18px;padding:0 20px;pointer-events:none;opacity:0;visibility:hidden}
.launch .hola{font:800 clamp(28px,9vw,36px)/1.1 var(--f-display);text-align:center;margin:0;opacity:0;transform:translateY(10px);transition:opacity .4s .9s,transform .5s .9s}
.launch .hola em{font-style:normal;color:var(--signal)}
.welcome.go .w-form,.welcome.go .w-copy{opacity:0;transform:translateY(28px);transition:opacity .3s,transform .4s cubic-bezier(.4,0,.2,1)}
.welcome.go .launch{opacity:1;visibility:visible;transition:opacity .25s .15s}
.welcome.go .launch .hola{opacity:1;transform:none}

/* Mis pedidos */
.olist{display:grid;gap:10px}
.pop-wrap{position:fixed;inset:0;z-index:60}
.pop-bg{position:absolute;inset:0;background:rgba(5,8,14,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.pop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 64px);right:max(14px,calc((100vw - 480px)/2 + 14px));width:min(318px,calc(100vw - 28px));max-height:calc(100svh - env(safe-area-inset-top,0px) - 90px);overflow:auto;overscroll-behavior:contain;
  box-sizing:border-box;padding:8px;border-radius:20px;color:#EEF0F5;font-family:var(--f-body);
  background:linear-gradient(160deg,rgba(32,42,64,.97),rgba(16,22,35,.98));border:1px solid rgba(255,255,255,.1);box-shadow:0 26px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);transform-origin:calc(100% - 22px) -8px}
.pop::before{content:"";position:absolute;top:-7px;right:18px;width:14px;height:14px;background:rgba(32,42,64,.97);border-left:1px solid rgba(255,255,255,.1);border-top:1px solid rgba(255,255,255,.1);transform:rotate(45deg)}
.pop-k{font:700 10.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--signal);padding:6px 10px 4px}
.acc{border-radius:14px;transition:background .2s}
.acc+.acc{margin-top:2px}
.acc[open]{background:rgba(255,255,255,.045)}
.acc summary{list-style:none;display:grid;grid-template-columns:30px minmax(0,1fr) auto 12px;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.acc summary::-webkit-details-marker{display:none}
.acc summary:active{background:rgba(255,255,255,.07)}
.acc-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(215,169,91,.14);font-size:15px;line-height:1}
.acc-t{font:700 14px var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-v{font-size:12px;color:#9AA3B6;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-chev{color:#7D869A;font-size:18px;line-height:1;transition:transform .25s cubic-bezier(.3,1.3,.5,1);justify-self:end}
.acc[open] .acc-chev{transform:rotate(90deg);color:var(--signal)}
.acc-body{display:grid;gap:8px;padding:2px 10px 12px 50px}
.acc-av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--signal);color:#1A1205;font:800 13px var(--f-display)}
.acc-av.sm{width:30px;height:30px}
.acc-line{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.acc-note{color:#9AA3B6;font-size:12px;line-height:1.4}
.acc-btns{display:flex;flex-wrap:wrap;gap:6px}
.mini-btn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#EEF0F5;font:700 12.5px var(--f-body);padding:8px 12px;border-radius:10px;cursor:pointer;justify-self:start}
.mini-btn.oro{background:var(--signal);border-color:var(--signal);color:#1A1205}
.acc-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.acc-tiles button{display:grid;gap:1px;justify-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:8px 4px;color:#EEF0F5;font:inherit;cursor:pointer}
.acc-tiles b{font:800 14px var(--f-display);font-variant-numeric:tabular-nums}.acc-tiles small{font-size:10.5px;color:#9AA3B6}
.acc-ct{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center}
.acc-ctx{display:grid;line-height:1.25}.acc-ctx b{font-size:13.5px}.acc-ctx small{font:500 12px var(--f-mono);color:#9AA3B6}
.wa-mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#25D366;color:#fff}
.wa-mini svg{width:18px;height:18px}
.acc-list{display:grid;gap:2px}
.acc-opt{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;border:0;background:none;color:#EEF0F5;font:600 13.5px var(--f-body);padding:8px;border-radius:10px;cursor:pointer}
.acc-opt .flag{font-size:18px;line-height:1}.acc-opt .tick{color:var(--signal);opacity:0;font-weight:800}
.acc-opt[aria-pressed="true"]{background:rgba(215,169,91,.14)}.acc-opt[aria-pressed="true"] .tick{opacity:1}
.acc-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(255,255,255,.05);border-radius:11px;padding:3px}
.acc-seg button{border:0;background:none;color:#9AA3B6;font:700 12.5px var(--f-body);padding:8px 4px;border-radius:9px;cursor:pointer}
.acc-seg button[aria-pressed="true"]{background:var(--signal);color:#1A1205}
.w-lang button{font-size:16px;padding:4px 7px;line-height:1.2}
@media (prefers-reduced-motion:no-preference){
 .pop{animation:popIn .32s cubic-bezier(.2,1.25,.4,1) both}.pop-bg{animation:fadein .25s both}
 .acc[open] .acc-body>*{animation:accIn .3s cubic-bezier(.2,.8,.2,1) both}
 .acc[open] .acc-body>:nth-child(2){animation-delay:.04s}.acc[open] .acc-body>:nth-child(3){animation-delay:.08s}
 .pop .acc{animation:accIn .35s cubic-bezier(.2,.8,.2,1) both}
 .pop .acc:nth-of-type(2){animation-delay:.03s}.pop .acc:nth-of-type(3){animation-delay:.06s}.pop .acc:nth-of-type(4){animation-delay:.09s}
 .pop .acc:nth-of-type(5){animation-delay:.12s}.pop .acc:nth-of-type(6){animation-delay:.15s}.pop .acc:nth-of-type(7){animation-delay:.18s}
 @keyframes popIn{from{opacity:0;transform:scale(.85) translateY(-6px)}}
 @keyframes accIn{from{opacity:0;transform:translateY(-6px)}}
}
.cfg-chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;background:var(--u-card);border:1px solid var(--u-line);border-radius:14px;padding:4px}
.cfg-chips button{border:0;background:none;color:var(--u-mute);font:700 13px var(--f-body);padding:10px 4px;border-radius:10px;cursor:pointer;transition:background .2s,color .2s}
.cfg-chips button[aria-pressed="true"]{background:var(--signal);color:#1A1205}
.w-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.w-lang{display:flex;gap:2px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px}
.w-lang button{border:0;background:none;color:rgba(255,255,255,.7);font:700 11px var(--f-body);letter-spacing:.04em;padding:6px 8px;border-radius:999px;cursor:pointer}
.w-lang button[aria-pressed="true"]{background:var(--signal);color:#1A1205}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:6}
.gear{position:relative;z-index:6;width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .3s}
.gear svg{width:20px;height:20px}.gear:active{transform:rotate(60deg) scale(.95)}
@media (prefers-reduced-motion:no-preference){.rise .gear{animation:giraIn .8s .3s cubic-bezier(.2,1.2,.4,1) both}@keyframes giraIn{from{opacity:0;transform:rotate(-180deg) scale(.6)}}}
.cfg-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--u-card);border:1px solid var(--u-line);border-radius:16px;padding:12px 14px;color:var(--u-ink);font:inherit;cursor:pointer}
.cfg-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(215,169,91,.14);color:var(--signal);font-size:16px}
.cfg-tx{display:grid;gap:2px;min-width:0}.cfg-tx b{font-size:15px}.cfg-tx small{color:var(--u-mute);font-size:12px}
.cfg-chev{color:var(--u-mute);font-size:22px}
.cfg-back{justify-self:start;border:0;background:none;color:var(--signal);font:700 14px var(--f-body);padding:4px 0;cursor:pointer}
.cfg-perfil{grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px}
.cfg-av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--signal);color:#1A1205;font:800 20px var(--f-display)}
.cfg-av.sm{width:38px;height:38px;font-size:15px}
.cfg-lab{font:700 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--u-mute);margin-top:4px}
.cfg-pedidos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cfg-pedidos button{display:grid;gap:2px;justify-items:center;background:var(--u-card);border:1px solid var(--u-line);border-radius:14px;padding:12px 6px;color:var(--u-ink);font:inherit;cursor:pointer}
.cfg-pedidos b{font:800 17px var(--f-display);font-variant-numeric:tabular-nums}.cfg-pedidos small{color:var(--u-mute);font-size:11px}
.cfg-ct{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--u-card);border:1px solid var(--u-line);border-radius:16px;padding:10px 12px}
.cfg-wa{padding:10px 14px;font-size:13px;text-decoration:none;background:#25D366;color:#fff}
.lock{position:fixed;inset:0;z-index:85;background:var(--navy);color:#fff;display:grid;place-items:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
.lock[hidden]{display:none}
.lock-box{width:100%;max-width:340px;display:grid;justify-items:center;gap:20px;text-align:center}

const LOCS={es:"es-PA",en:"en-US",pt:"pt-BR",fr:"fr-FR"};
const LIX=()=>({en:0,pt:1,fr:2})[LANG];
function trCore(c){if(LANG==="es")return null;const d=I18N[c];if(d)return d[LIX()];
  for(const[re,v]of I18P){const m=c.match(re);if(m)return v[LIX()].replace(/\$(\d)/g,(_,i)=>m[i]??"").replace(/\{t(\d)\}/g,(_,i)=>tr(m[i]))
    .replace(/\{l(\d)\}/g,(_,i)=>{const x=tr(m[i].charAt(0).toUpperCase()+m[i].slice(1));return x.charAt(0).toLowerCase()+x.slice(1)})}
  return null}
function tr(s){const t=String(s??""),c=t.trim();if(!c||LANG==="es")return t;const r=trCore(c);return r==null?t:t.replace(c,r)}
function traducir(root){if(LANG==="es"||!root)return;
  if(root.nodeType===3){const r=tr(root.nodeValue);if(r!==root.nodeValue)root.nodeValue=r;return}
  if(root.nodeType!==1||root.closest?.("script,style,[data-notr]"))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){if(n.parentElement?.closest("script,style,textarea,[data-notr]"))continue;const r=tr(n.nodeValue);if(r!==n.nodeValue)n.nodeValue=r}
  [root,...root.querySelectorAll("[placeholder],[aria-label],[title]")].forEach(e=>["placeholder","aria-label","title"].forEach(k=>{const v=e.getAttribute?.(k);if(v){const r=tr(v);if(r!==v)e.setAttribute(k,r)}}))}
new MutationObserver(ms=>{if(LANG==="es")return;for(const m of ms){if(m.type==="characterData")traducir(m.target);else m.addedNodes.forEach(traducir)}})
  .observe(document.body,{childList:true,subtree:true,characterData:true});

function rutaSVG(i){
  // 4 hitos sobre una curva: China → Vuelo → Panamá → Tu puerta
  const pts=[[24,98],[150,40],[262,70],[372,26]];
  const hito=[0,0,0.5,1.4,2,2.2,2.5,2.8,3]; // hasta qué hito llegó según la etapa
  const labels=["China","En vuelo","Panamá","Tu puerta"];
  return `<svg viewBox="0 0 396 130" role="img" aria-label="Ruta del paquete: ${CORTO[i]}">
    <path d="${RUTA}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2" stroke-dasharray="3 6"/>
    <path id="trail" d="${RUTA}" fill="none" stroke="var(--signal)" stroke-width="3" stroke-linecap="round"/>
    ${pts.map((p,k)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${k<=hito[i]?5:4}" fill="${k<=hito[i]?'var(--signal)':'var(--navy-2)'}" stroke="${k<=hito[i]?'var(--signal)':'rgba(255,255,255,.35)'}" stroke-width="2"/>
      <text class="lbl ${k<=hito[i]?'on':''}" x="${p[0]}" y="${p[1]+(k%2?-14:22)}" text-anchor="${k===0?'start':k===3?'end':'middle'}">${labels[k]}</text>`).join("")}
    <g id="pkg">${PKG}</g>
  </svg>`;
}
function animarRuta(i){
  const path=document.getElementById("trail"),pkg=document.getElementById("pkg");if(!path)return;const L=path.getTotalLength();
  const fin=L*[.02,.06,.16,.42,.66,.7,.76,.88,1][i];
  path.style.strokeDasharray=L;
  const set=v=>{path.style.strokeDashoffset=L-v;const p=path.getPointAtLength(v);pkg.setAttribute("transform",`translate(${p.x} ${p.y})`)};
  if(reduce()){set(fin);return}
  const t0=performance.now(),dur=1400;
  (function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);set(fin*e);if(k<1)requestAnimationFrame(f)})(t0);
}

  const L=document.createElement("div");L.className="upd-load";L.setAttribute("role","status");
  L.innerHTML=`<img src="${LOGO}" alt=""><h2>Actualizando</h2><div class="upd-bar"><i></i></div>
    <ol class="upd-pasos"><li><span></span>Buscando la nueva versión</li><li><span></span>Descargando la actualización</li><li><span></span>Instalando</li></ol>
    <p class="upd-msg">Tus datos no se pierden.</p>`;
  document.body.appendChild(L);const pasos=L.querySelectorAll("li"),bar=L.querySelector(".upd-bar i");
  const paso=async(i,fn,min)=>{pasos[i].className="on";bar.style.width=(i*33+12)+"%";const t0=Date.now(),r=await fn();await espera(Math.max(0,min-(Date.now()-t0)));pasos[i].className="ok";pasos[i].firstChild.innerHTML="✓";bar.style.width=((i+1)*33.4)+"%";return r};
  const falla=(t,txt)=>{L.innerHTML=`<img src="${LOGO}" alt=""><h2>${t}</h2><p class="upd-msg">${txt}</p><button class="upd-btn" style="min-width:200px">Cerrar</button>`;L.querySelector("button").onclick=()=>L.remove()};
  const v=await paso(0,leerVersion,800);const n=v?.[APP];
  if(!n)return falla("Sin conexión","No pudimos revisar la actualización. Revisa tu internet e intenta de nuevo.");
  if(n<=APP_VERSION){L.remove();return revisarAct()}
  const lista=await paso(1,async()=>{try{const r=await fetch(destinoAct(n),{cache:"reload"});return(await r.text()).includes(`APP_VERSION=${n};`)}catch(e){return false}},1200);
  if(!lista)return falla("Casi lista","La actualización todavía se está publicando. Intenta de nuevo en uno o dos minutos.");
  await paso(2,()=>{try{localStorage.setItem("dc-actualizado-"+APP,APP_VERSION+">"+n)}catch(e){}},900);
  L.innerHTML=`<div class="upd-fin">${ICO_OK}</div><h2>¡Listo!</h2><p class="upd-msg">Abriendo la versión ${n}…</p>`;
  await espera(900);location.replace(destinoAct(n))}
/* Al abrir después de actualizar: mostrar lo que trae la versión nueva */
async function avisoActualizado(){let k=null;try{k=localStorage.getItem("dc-actualizado-"+APP)}catch(e){}if(!k)return;
  const[de,a]=k.split(">").map(Number);if(a!==APP_VERSION)return;try{localStorage.removeItem("dc-actualizado-"+APP)}catch(e){}
  await revisarAct();hojaUpd({k:"Actualización completa",titulo:`¡Ya tienes la versión ${APP_VERSION}!`,lista:notas(ACT.v,de,APP_VERSION),botones:`<button class="upd-btn" data-updx>Entendido</button>`})}
document.addEventListener("click",e=>{const t=e.target.closest("[data-updx],[data-updgo],[data-novedades]");if(!t)return;e.preventDefault();
  if("updx" in t.dataset)cerrarUpd();else if("updgo" in t.dataset)actualizar();else abrirNovedades()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")cerrarUpd()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")revisarAct()});
setInterval(revisarAct,10*60*1000);
revisarAct().then(avisoActualizado);
ruta();
</script>
