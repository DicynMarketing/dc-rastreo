<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071230">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="../assets/dc-logo-160.png">
<link rel="apple-touch-icon" href="../assets/dc-logo-160.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mi Pedido DC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app móvil del cliente. Banda marina con la ruta del paquete arriba, hoja clara con el detalle abajo. Un solo look, fijo. */
:root{
  --navy:#0A1A3F; --navy-2:#132A5E; --navy-3:#1E3B7A;
  --signal:#D7A95B;  /* dorado del logo DC Marketing */ --steel:#4B4C4E;
  --paper:#F5F3EE; --card:#FFFFFF; --ink:#0A1A3F; --muted:#5B6683; --line:#E3E1DA;
  --ok:#17905E;
  --f-display:"Unbounded",system-ui,sans-serif; --f-body:"Figtree",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
html,body{background:var(--navy)}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* Banda superior */
.hero{color:#fff;padding-block:18px 8px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 70% at 110% -10%,rgba(215,169,91,.18),transparent 60%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 34px);pointer-events:none}
.brand{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.04em}
.mark img{width:30px;height:auto;display:block}
.code-chip{font-family:var(--f-mono);font-size:12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 10px;background:none;color:#fff;cursor:pointer}
.greet{position:relative;z-index:1;margin-top:26px}
.greet p{margin:0;color:rgba(255,255,255,.7);font-size:14px}
.greet h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,8vw,34px);line-height:1.05;margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
.greet h1 em{font-style:normal;color:var(--signal)}
.last{margin-top:10px;font-size:13px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:8px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 0 rgba(215,169,91,.6)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:p 1.8s infinite}@keyframes p{70%{box-shadow:0 0 0 10px rgba(215,169,91,0)}100%{box-shadow:0 0 0 0 rgba(215,169,91,0)}}}

/* Ruta */
.route{position:relative;z-index:1;margin:18px 0 0}
.route svg{width:100%;height:auto;display:block;overflow:visible}
.route .lbl{font-family:var(--f-body);font-size:11px;font-weight:600;fill:rgba(255,255,255,.55);letter-spacing:.04em}
.route .lbl.on{fill:#fff}

/* Hoja */
.sheet{background:var(--paper);border-radius:26px 26px 0 0;flex:1;padding-block:22px 40px;margin-top:6px;display:grid;gap:22px;align-content:start}
.sec-t{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:10px 0;position:relative}
.steps li:not(:last-child)::after{content:"";position:absolute;left:13px;top:34px;bottom:-10px;width:2px;background:var(--line)}
.steps li.done:not(:last-child)::after{background:var(--navy-3)}
.n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--line);color:var(--muted);background:var(--paper);box-sizing:border-box;position:relative;z-index:1}
.done .n{background:var(--navy);border-color:var(--navy);color:#fff}
.now .n{background:var(--signal);border-color:var(--signal);color:var(--navy)}
.steps .t{font-weight:600;line-height:1.3;padding-top:3px}
.steps .h{font-size:13px;color:var(--muted)}
.steps li:not(.done):not(.now) .t{color:var(--muted);font-weight:500}
.steps .when{font-size:12px;color:var(--muted);padding-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.now .t::after{content:"Ahora";margin-left:8px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--navy);color:var(--signal);padding:2px 7px;border-radius:999px;vertical-align:2px}
.delivered .now .t::after{content:"Listo";color:#fff;background:var(--ok)}

.contact{background:var(--card);border-radius:18px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;border:1px solid var(--line)}
.av{grid-row:span 2;width:46px;height:46px;border-radius:14px;background:var(--navy);color:var(--signal);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.contact b{font-size:15px}
.contact .num{font-family:var(--f-mono);font-size:14px;user-select:all;color:var(--navy-3)}
.contact .row{grid-column:1/-1;display:flex;gap:8px;margin-top:10px}
.btn{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:6px;border:0;border-radius:12px;padding:12px;font:700 14px var(--f-body);cursor:pointer;text-decoration:none}
.btn.wa{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:focus-visible,.code-chip:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* Pantalla de código */
.enter{color:#fff;padding-block:40px;display:grid;gap:18px}
.enter h1{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1;margin:0}
.enter p{margin:0;color:rgba(255,255,255,.75)}
.enter form{display:flex;gap:8px}
.enter input{flex:1;min-width:0;font:600 18px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:14px;border-radius:14px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff}
.enter input::placeholder{color:rgba(255,255,255,.4)}
.enter .btn{flex:0 0 auto;background:var(--signal);color:var(--navy);padding:0 20px}
.err{color:var(--signal);font-size:14px}
.demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:rgba(255,255,255,.6)}
.demo button{font:500 12px var(--f-mono);background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:8px;padding:5px 9px;cursor:pointer}
</style>
</head>

function rutaSVG(i){
  // 4 hitos sobre una curva: China → Vuelo → Panamá → Tu puerta
  const pts=[[24,98],[150,40],[262,70],[372,26]];
  const hitoDeEstado=[0,0,0.5,1.4,2,2.3,2.7,3]; // posición del paquete sobre la ruta
  const labels=["China","En vuelo","Panamá","Tu puerta"];
  const d="M24 98 C 80 98, 100 40, 150 40 S 220 70, 262 70 S 330 26, 372 26";
  return `<svg viewBox="0 0 396 130" role="img" aria-label="Ruta del paquete: ${CORTO[i]}">
    <path d="${d}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2" stroke-dasharray="3 6"/>
    <path id="trail" d="${d}" fill="none" stroke="var(--signal)" stroke-width="3" stroke-linecap="round"/>
    ${pts.map((p,k)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${k<=hitoDeEstado[i]?5:4}" fill="${k<=hitoDeEstado[i]?'var(--signal)':'var(--navy-2)'}" stroke="${k<=hitoDeEstado[i]?'var(--signal)':'rgba(255,255,255,.35)'}" stroke-width="2"/>
      <text class="lbl ${k<=hitoDeEstado[i]?'on':''}" x="${p[0]}" y="${p[1]+(k%2?-14:22)}" text-anchor="${k===0?'start':k===3?'end':'middle'}">${labels[k]}</text>`).join("")}
    <g id="pkg"><rect x="-13" y="-13" width="26" height="26" rx="7" fill="#fff"/>
      <path d="M-6 -3 L0 -6 L6 -3 L6 4 L0 7 L-6 4 Z M-6 -3 L0 0 L6 -3 M0 0 L0 7" fill="none" stroke="var(--navy)" stroke-width="1.6" stroke-linejoin="round"/></g>
  </svg>`;
}

  const path=document.getElementById("trail"),pkg=document.getElementById("pkg"),L=path.getTotalLength();
  const frac=[0,.02,.14,.42,.66,.74,.86,1][i];
  const fin=L*frac, reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  path.style.strokeDasharray=L;
  const set=v=>{path.style.strokeDashoffset=L-v;const p=path.getPointAtLength(v);pkg.setAttribute("transform",`translate(${p.x} ${p.y})`)};
  if(reduce){set(fin);return}
  const t0=performance.now(),dur=1400;
  (function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);set(fin*e);if(k<1)requestAnimationFrame(f)})(t0);
}

function pantallaCodigo(msg){
  app.innerHTML=`<div class="enter pad">
    <div class="mark"><img src="${LOGO}" alt="">DC MARKETING</div>
    <h1>¿Dónde está mi pedido?</h1>
    <p>Escribe el código que te llegó por WhatsApp.</p>
    <form id="f"><input id="code" placeholder="DC-0000" aria-label="Código de pedido" autocomplete="off"><button class="btn" type="submit">Buscar</button></form>
    ${msg?`<div class="err">${msg}</div>`:""}
    <div class="demo">Códigos de ejemplo: ${Object.keys(PEDIDOS).map(c=>`<button data-c="${c}">${c}</button>`).join("")}</div>
  </div>`;
  document.getElementById("f").onsubmit=e=>{e.preventDefault();ir(document.getElementById("code").value)};
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>ir(b.dataset.c));
}
function ir(v){
  const c=String(v).trim().toUpperCase().replace(/^(DC)?-?(\d{4})$/,"DC-$2");
  if(location.hash.slice(1)===c)mostrar();else location.hash=c;
}

function mostrar(){
  const code=decodeURIComponent(location.hash.slice(1)).toUpperCase();
  if(!code)return pantallaCodigo();
  const p=PEDIDOS[code];
  if(!p)return pantallaCodigo(`No encontramos el código ${code.replace(/[^A-Z0-9-]/g,"")}. Revisa el mensaje o escríbenos.`);
  const i=p.h.length-1, quien=EQUIPO[p.quien], entregado=i===7;
  const titular=entregado?`¡Tu paquete <em>llegó</em>!`:i>=4?`Tu paquete ya está <em>en Panamá</em>`:i===3?`Tu paquete va <em>en vuelo</em>`:`Tu pedido está <em>en marcha</em>`;
  const wa=`https://wa.me/507${quien.tel}?text=${encodeURIComponent(`Hola ${quien.nombre}, consulto por mi pedido ${code}.`)}`;
  app.innerHTML=`
  <header class="hero pad">
    <div class="brand"><div class="mark"><img src="${LOGO}" alt="">DC MARKETING</div><button class="code-chip" id="cambiar" aria-label="Cambiar de pedido">${code}</button></div>
    <div class="greet"><p>Hola, ${p.nombre}</p><h1>${titular}</h1>
      <div class="last"><span class="pulse"></span>${CORTO[i]} · ${hace(p.h[i])}</div></div>
    <div class="route">${rutaSVG(i)}</div>
  </header>
  <main class="sheet pad ${entregado?"delivered":""}">
    <section><h2 class="sec-t">Recorrido</h2>
      <ol class="steps">${ESTADOS.map((e,k)=>`<li class="${k<i?"done":k===i?"now done":""}">
        <span class="n">${k<i?"✓":k+1}</span><div><div class="t">${e[0]}</div>${k===i?`<div class="h">${e[1]}</div>`:""}</div>
        <span class="when">${p.h[k]?dia(p.h[k]):""}</span></li>`).join("")}</ol>
    </section>
    <section><h2 class="sec-t">Tu contacto</h2>
      <div class="contact"><div class="av">${quien.nombre[0]}</div><b>${quien.nombre} · DC Marketing</b><span class="num">${fmtTel(quien.tel)}</span>
        <div class="row"><a class="btn wa" href="${wa}" target="_blank" rel="noopener">Escribir por WhatsApp</a></div></div>
    </section>
    <p class="note">Las fechas se actualizan automáticamente con el rastreo de la paquetería. Los tiempos pueden variar en aduana.</p>
  </main>`;
  document.getElementById("cambiar").onclick=()=>{history.replaceState(null,"",location.pathname);pantallaCodigo()};
  requestAnimationFrame(()=>animarRuta(i));
}
addEventListener("hashchange",mostrar);
// Sin código en el link se muestra la pantalla para escribirlo (antes abría siempre el pedido de María).
mostrar();
</script>
