<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151D2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Pedido">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="../assets/dc-logo-160.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mi Pedido DC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app móvil del cliente. Entrada con nombre → "Mis pedidos" → seguimiento de cada pedido.
   Banda marina con la ruta del paquete arriba, hoja clara con el detalle abajo. */
:root{
  /* Azul marino apagado (no eléctrico), hoja beige, bandejas negras con letras blancas, dorado del logo */
  --navy:#151D2E; --navy-2:#222B3F; --navy-3:#3A4660;
  --signal:#D7A95B;  /* dorado del logo DC Marketing */ --steel:#4B4C4E;
  --paper:#F2ECE1; --card:#0B0C10; --card-ink:#F5F2EC; --card-mute:#A3A9B6; --ink:#151D2E; --muted:#61677A; --line:#E0D8C8;
  --ok:#17905E;
  --f-display:"Unbounded",system-ui,sans-serif; --f-body:"Figtree",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
html,body{background:var(--navy)}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.grid-bg::after{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 70% at 110% -10%,rgba(215,169,91,.18),transparent 60%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 34px);pointer-events:none}

/* Banda superior */
.hero{color:#fff;padding-block:18px 8px;position:relative;overflow:hidden}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.04em}
.mark img{width:30px;height:auto;display:block}
.code-chip{font-family:var(--f-mono);font-size:12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 11px;background:none;color:#fff;cursor:pointer;white-space:nowrap}
.greet{position:relative;z-index:1;margin-top:26px}
.greet p{margin:0;color:rgba(255,255,255,.7);font-size:14px}
.greet h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,8vw,34px);line-height:1.05;margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
.greet h1 em,.welcome h1 em{font-style:normal;color:var(--signal)}
.last{margin-top:10px;font-size:13px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 0 rgba(215,169,91,.6)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:p 1.8s infinite}@keyframes p{70%{box-shadow:0 0 0 10px rgba(215,169,91,0)}100%{box-shadow:0 0 0 0 rgba(215,169,91,0)}}}

/* Ruta */
.route{position:relative;z-index:1;margin:18px 0 0}
.route svg,.launch svg{width:100%;height:auto;display:block;overflow:visible}
.route .lbl{font-family:var(--f-body);font-size:11px;font-weight:600;fill:rgba(255,255,255,.55);letter-spacing:.04em}
.route .lbl.on{fill:#fff}

/* Hoja */
.sheet{background:var(--paper);border-radius:26px 26px 0 0;flex:1;padding-block:22px 40px;margin-top:6px;display:grid;gap:22px;align-content:start}
.sheet>*{min-width:0}
@media (prefers-reduced-motion:no-preference){.rise .sheet{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}.rise .greet{animation:rise .5s .05s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(36px)}}}
.sec-t{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:10px 0;position:relative}
.steps li:not(:last-child)::after{content:"";position:absolute;left:13px;top:34px;bottom:-10px;width:2px;background:var(--line)}
.steps li.done:not(:last-child)::after{background:var(--navy-3)}
.n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--line);color:var(--muted);background:var(--paper);box-sizing:border-box;position:relative;z-index:1}
.done .n{background:var(--navy);border-color:var(--navy);color:#fff}
.now .n{background:var(--signal);border-color:var(--signal);color:var(--navy)}
.steps .t{font-weight:600;line-height:1.3;padding-top:3px}
.steps .h{font-size:13px;color:var(--muted)}
.steps li:not(.done):not(.now) .t{color:var(--muted);font-weight:500}
.steps .when{font-size:12px;color:var(--muted);padding-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.now .t::after{content:"Ahora";margin-left:8px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--navy);color:var(--signal);padding:2px 7px;border-radius:999px;vertical-align:2px}
.delivered .now .t::after{content:"Listo";color:#fff;background:var(--ok)}

.contact{background:var(--card);color:var(--card-ink);border-radius:18px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.av{grid-row:span 2;width:46px;height:46px;border-radius:14px;background:var(--navy-2);color:var(--signal);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.contact b{font-size:15px}
.contact .num{font-family:var(--f-mono);font-size:14px;color:var(--card-mute);display:flex;align-items:center}
.contact .row{grid-column:1/-1;display:flex;gap:8px;margin-top:10px}
.btn{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:6px;border:0;border-radius:12px;padding:12px;font:700 14px var(--f-body);cursor:pointer;text-decoration:none}
.btn.wa{background:var(--signal);color:#1A1205}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:focus-visible,.code-chip:focus-visible,input:focus-visible,.ocard:focus-visible,.go-btn:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* Bienvenida: entrar con nombre y apellido */
.welcome{color:#fff;min-height:100vh;min-height:100svh;box-sizing:border-box;display:flex;flex-direction:column;padding-block:28px 32px;position:relative;overflow:hidden}
.w-copy,.w-form{position:relative;z-index:1}
.welcome .mark img{width:40px}
.welcome h1{font:800 clamp(30px,9vw,38px)/1.06 var(--f-display);margin:44px 0 12px;letter-spacing:-.01em;text-wrap:balance}
.welcome .sub{color:rgba(255,255,255,.75);margin:0;max-width:30ch}
.w-form{margin-top:auto;padding-top:36px;display:grid;gap:14px}
.fld{display:grid;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.fld input{font:600 18px var(--f-body);color:#fff;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.22);border-radius:14px;padding:14px 16px;width:100%;box-sizing:border-box;letter-spacing:0;text-transform:none;transition:border-color .2s,background .2s}
.fld input:focus{border-color:var(--signal);background:rgba(255,255,255,.1);outline:none}
.fld input::placeholder{color:rgba(255,255,255,.35)}
.go-btn{margin-top:6px;display:flex;justify-content:center;align-items:center;gap:10px;background:var(--signal);color:var(--navy);font:800 16px var(--f-display);letter-spacing:.02em;padding:17px;border-radius:16px;border:0;cursor:pointer;transition:transform .15s}
.go-btn:active{transform:scale(.98)}
.go-btn svg{width:20px;height:20px}
.invite{background:rgba(215,169,91,.14);border:1px solid rgba(215,169,91,.4);border-radius:14px;padding:12px 14px;font-size:14px;color:#fff}
.w-alt{text-align:center;font-size:13px;color:rgba(255,255,255,.6);margin:4px 0 0}
.w-alt a{color:#fff}
.err{color:var(--signal);font-size:14px;margin:0}
/* Animación de "Iniciar": el formulario baja, el paquete recorre la ruta y aparece el saludo */
.launch{position:absolute;inset:0;z-index:2;display:grid;align-content:center;gap:18px;padding:0 20px;pointer-events:none;opacity:0;visibility:hidden}
.launch .hola{font:800 clamp(28px,9vw,36px)/1.1 var(--f-display);text-align:center;margin:0;opacity:0;transform:translateY(10px);transition:opacity .4s .9s,transform .5s .9s}
.launch .hola em{font-style:normal;color:var(--signal)}
.welcome.go .w-form,.welcome.go .w-copy{opacity:0;transform:translateY(28px);transition:opacity .3s,transform .4s cubic-bezier(.4,0,.2,1)}
.welcome.go .launch{opacity:1;visibility:visible;transition:opacity .25s .15s}
.welcome.go .launch .hola{opacity:1;transform:none}

/* Mis pedidos */
.olist{display:grid;gap:10px}
.ocard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);color:var(--card-ink);border:1px solid var(--card);border-radius:18px;padding:14px;text-decoration:none;transition:border-color .2s,transform .15s}
.ocard:active{transform:scale(.99)}
.ocard:hover{border-color:var(--signal)}
.oico{width:44px;height:44px;border-radius:13px;background:var(--navy-2);color:var(--signal);display:grid;place-items:center}
.oico svg{width:22px;height:22px}
.ocard.ok .oico{background:var(--ok);color:#fff}
.ost{font-weight:700;display:block;line-height:1.25}
.omet{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--card-mute);margin-top:2px}
.omet .mono{font-family:var(--f-mono);font-size:12px}
.bar9{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:9px}
.bar9 i{height:4px;border-radius:2px;background:#2A2F3A}
.bar9 i.on{background:var(--signal)}
.ocard.ok .bar9 i.on{background:var(--ok)}
.chev{width:18px;height:18px;color:var(--card-mute)}
.empty-c{background:#FBF8F2;border:1.5px dashed #D3C9B4;border-radius:20px;padding:28px 20px;text-align:center;display:grid;gap:8px;justify-items:center}
.empty-c svg{width:58px;height:58px;color:var(--navy-3)}
.empty-c b{font:700 18px/1.2 var(--f-display)}
.empty-c p{margin:0;color:var(--muted);max-width:30ch}
.encargo{display:flex;gap:10px;align-items:center;background:rgba(215,169,91,.14);border-radius:14px;padding:12px 14px;font-size:14px}
.encargo svg{width:20px;height:20px;flex:none;color:#9A7230}
.tip{background:var(--card);color:#fff;border-radius:16px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:14px}
.tip small{color:rgba(255,255,255,.7);display:block}
.tip .tbtn{background:var(--signal);color:var(--navy);border:0;border-radius:10px;padding:9px 14px;font:700 14px var(--f-body);cursor:pointer}
.tip .tx{background:none;border:0;color:rgba(255,255,255,.6);font-size:22px;line-height:1;cursor:pointer;padding:4px}
.foot{display:flex;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--navy-3);font:600 13px var(--f-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}

/* Sin selección de texto ni menú de copiar (salvo en campos). Copiar con el botón. */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.cp{display:inline-grid;place-items:center;width:26px;height:26px;margin-left:6px;vertical-align:middle;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:rgba(255,255,255,.06);color:inherit;cursor:pointer;padding:0;flex:none;transition:background .15s,color .15s}
.cp svg{width:14px;height:14px}
.cp.ok{background:var(--signal);color:#1A1205;border-color:var(--signal)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--card);color:var(--card-ink);font-weight:600;padding:10px 16px;border-radius:12px}
@media (prefers-reduced-motion:no-preference){.olist>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}.olist>:nth-child(2){animation-delay:.06s}.olist>:nth-child(3){animation-delay:.12s}.olist>:nth-child(n+4){animation-delay:.18s}
  .bar9 i.on{animation:grow .9s cubic-bezier(.2,.8,.2,1) .2s both;transform-origin:left}@keyframes grow{from{transform:scaleX(0)}}}
:root{--u-bg:var(--card);--u-card:#16181F;--u-ink:var(--card-ink);--u-mute:var(--card-mute);--u-line:#2A2F3A;--u-acc:var(--signal);--u-acc-ink:#1A1205;--u-load:var(--navy);--u-font:var(--f-display);--u-body:var(--f-body);--u-bottom:24px}
body.hay-act .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
/* ---------- Actualizaciones: botón "Nueva actualización", hoja de novedades y pantalla de carga ---------- */
.act-pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--u-bottom) + env(safe-area-inset-bottom,0px));z-index:35;display:flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:10px 16px 10px 12px;background:var(--u-acc);color:var(--u-acc-ink);font:800 13px var(--u-font);cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45);white-space:nowrap}
.act-pill .dot{width:10px;height:10px;border-radius:50%;background:var(--u-acc-ink);box-shadow:0 0 0 0 rgba(0,0,0,.35)}
.act-pill svg{width:16px;height:16px}
@media (prefers-reduced-motion:no-preference){.act-pill:not([hidden]){animation:pillin .5s cubic-bezier(.2,1.4,.4,1) both}.act-pill .dot{animation:latido 1.6s infinite}
 @keyframes pillin{from{opacity:0;transform:translate(-50%,24px) scale(.9)}}
 @keyframes latido{70%{box-shadow:0 0 0 8px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}}
.upd{position:fixed;inset:0;z-index:60;display:grid;align-items:end;justify-items:center}
.upd-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.upd-sheet{position:relative;width:100%;max-width:520px;max-height:86vh;overflow:auto;box-sizing:border-box;background:var(--u-bg);color:var(--u-ink);border-radius:26px 26px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;border:1px solid var(--u-line);border-bottom:0;font-family:var(--u-body)}
@media (min-width:700px){.upd{align-items:center}.upd-sheet{border-radius:24px;border-bottom:1px solid var(--u-line)}}
.upd-grab{width:44px;height:5px;border-radius:3px;background:var(--u-line);justify-self:center}
.upd-k{margin:0;font:800 11px var(--u-body);letter-spacing:.12em;text-transform:uppercase;color:var(--u-acc)}
.upd h2{margin:0;font:800 22px/1.15 var(--u-font);color:var(--u-ink);text-transform:none;letter-spacing:-.01em}
.upd-nota{display:grid;gap:8px;background:var(--u-card);border:1px solid var(--u-line);border-radius:16px;padding:14px}
.upd-nota b{font-size:15px}
.upd-nota small{color:var(--u-mute);font-size:12px}
.upd-nota ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.upd-nota li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:14px;line-height:1.4}
.upd-nota li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--u-acc);margin-top:6px}
.upd-tag{display:inline-block;font:700 10px var(--u-body);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-right:6px;background:var(--u-line);color:var(--u-ink);vertical-align:1px}
.upd-tag.cli{background:var(--u-acc);color:var(--u-acc-ink)}
.upd-btns{display:grid;gap:8px}
.upd-btn{border:0;border-radius:14px;padding:15px;font:800 15px var(--u-body);cursor:pointer;background:var(--u-acc);color:var(--u-acc-ink)}
.upd-btn.sec{background:transparent;color:var(--u-ink);border:1px solid var(--u-line);font-weight:700}
@media (prefers-reduced-motion:no-preference){.upd-bg{animation:fadein .25s both}.upd-sheet{animation:subir .4s cubic-bezier(.2,.9,.3,1) both}.upd-nota{animation:subir .45s cubic-bezier(.2,.9,.3,1) both}.upd-nota:nth-of-type(2){animation-delay:.06s}.upd-nota:nth-of-type(3){animation-delay:.12s}
 @keyframes fadein{from{opacity:0}}@keyframes subir{from{opacity:0;transform:translateY(40px)}}}
.upd-load{position:fixed;inset:0;z-index:70;background:var(--u-load);color:#fff;display:grid;place-content:center;justify-items:center;gap:18px;padding:24px;text-align:center;font-family:var(--u-body)}
.upd-load img{width:64px}
.upd-load h2{margin:0;font:800 24px var(--u-font);color:#fff;text-transform:none;letter-spacing:-.01em}
.upd-bar{width:min(280px,72vw);height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.upd-bar i{display:block;height:100%;width:0;border-radius:4px;background:var(--u-acc);transition:width .6s cubic-bezier(.3,.8,.3,1)}
.upd-pasos{list-style:none;margin:0;padding:0;display:grid;gap:10px;text-align:left;min-width:min(280px,72vw)}
.upd-pasos li{display:flex;gap:10px;align-items:center;font-size:15px;color:rgba(255,255,255,.45);transition:color .3s}
.upd-pasos li span{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:12px;flex:none;box-sizing:border-box}
.upd-pasos li.on{color:#fff}.upd-pasos li.on span{border-color:var(--u-acc);border-top-color:transparent;animation:gira .8s linear infinite}
.upd-pasos li.ok{color:#fff}.upd-pasos li.ok span{background:var(--u-acc);border-color:var(--u-acc);color:var(--u-acc-ink);animation:none}
.upd-fin{width:72px;height:72px;border-radius:50%;background:var(--u-acc);color:var(--u-acc-ink);display:grid;place-items:center}
.upd-fin svg{width:36px;height:36px}
@media (prefers-reduced-motion:no-preference){.upd-fin{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}@keyframes pop{from{transform:scale(.3);opacity:0}}}
@keyframes gira{to{transform:rotate(360deg)}}
.upd-msg{color:rgba(255,255,255,.75);margin:0;max-width:32ch}
.novedades-link{background:none;border:0;padding:0;font:600 13px var(--u-body);color:var(--u-acc);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* Pantalla de código */
.enter{color:#fff;padding-block:28px 40px;display:grid;gap:18px;position:relative}
.enter h1{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1;margin:22px 0 0}
.enter p{margin:0;color:rgba(255,255,255,.75)}
.enter form{display:flex;gap:8px}
.enter input{flex:1;min-width:0;font:600 18px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:14px;border-radius:14px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff}
.enter input::placeholder{color:rgba(255,255,255,.4)}
.enter .btn{flex:0 0 auto;background:var(--signal);color:var(--navy);padding:0 20px}
.back{justify-self:start;background:none;border:0;color:rgba(255,255,255,.8);font:600 14px var(--f-body);padding:0;cursor:pointer}
.demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:rgba(255,255,255,.6)}

  path.style.strokeDasharray=L;path.style.strokeDashoffset=L;
  const t0=performance.now()+280,dur=1150;
  (function f(t){const k=Math.max(0,Math.min(1,(t-t0)/dur)),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,v=L*e;
    path.style.strokeDashoffset=L-v;const p=path.getPointAtLength(v);pkg.setAttribute("transform",`translate(${p.x} ${p.y})`);
    if(k<1)requestAnimationFrame(f);else setTimeout(fin,450)})(performance.now());
}

/* ---------- Mis pedidos ---------- */
let bip=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();bip=e;if(vistaActual==="inicio")inicio()});
function tipHTML(){
  if(matchMedia("(display-mode: standalone)").matches||navigator.standalone||leer(K_TIP,0))return"";
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(bip)return`<div class="tip"><span><b>Tenla como app</b><small>Instálala y ábrela con un toque.</small></span><span style="display:flex;gap:4px;align-items:center"><button class="tbtn" data-instalar>Instalar</button><button class="tx" data-tipx aria-label="Cerrar">×</button></span></div>`;
  if(ios)return`<div class="tip"><span><b>Tenla como app</b><small>En Safari toca Compartir y luego “Agregar a inicio”.</small></span><button class="tx" data-tipx aria-label="Cerrar">×</button></div>`;
  return"";
}
function ocard(v){const ok=v.i===8;
  return`<a class="ocard ${ok?"ok":""}" href="#${v.code}"><span class="oico">${ok?IC.check:IC.box}</span>
    <span style="min-width:0"><span class="ost">${ESTADOS[v.i][0]}</span><span class="omet"><span class="mono">${v.code}</span>${cp(v.code)}<span>${hace(v.h[v.i])}</span></span>
    <span class="bar9">${ESTADOS.map((_,k)=>`<i class="${k<=v.i?"on":""}"></i>`).join("")}</span></span>${IC.chev}</a>`}
function inicio(anim){
  vistaActual="inicio";
  const r=miRegistro();if(!r)return bienvenida();
  refrescarMis();
  const {lista,encargos,quien,cargando,error}=misPedidos(),act=lista.filter(v=>v.i<8),hechos=lista.filter(v=>v.i===8);
  const h1=cargando?`Buscando tus <em>pedidos</em>…`:lista.length?(act.length?`Tienes <em>${act.length} ${act.length===1?"pedido":"pedidos"}</em> en camino`:`Todos tus pedidos <em>llegaron</em>`):`Aún no tienes <em>pedidos</em>`;
  const contactos=(quien?[quien]:Object.keys(EQUIPO));
  app.innerHTML=`<div class="${anim?"rise":""}" style="display:flex;flex-direction:column;flex:1">
  <header class="hero pad grid-bg" style="padding-bottom:26px">
    <div class="brand"><div class="mark"><img src="${LOGO}" alt="">DC MARKETING</div></div>
    <div class="greet"><p>Hola, ${esc(r.nombre)}</p><h1>${h1}</h1>
      ${act[0]?`<div class="last"><span class="pulse"></span>Último movimiento: ${CORTO[act[0].i]} · ${hace(act[0].h[act[0].i])}</div>`:""}</div>
  </header>
  <main class="sheet pad">
    ${tipHTML()}
    ${encargos?`<div class="encargo">${IC.cart}<span>Tienes ${encargos===1?"un encargo anotado":`${encargos} encargos anotados`}. Te avisamos en cuanto lo compremos.</span></div>`:""}
    ${act.length?`<section><h2 class="sec-t">En camino</h2><div class="olist">${act.map(ocard).join("")}</div></section>`:""}
    ${hechos.length?`<section><h2 class="sec-t">Entregados</h2><div class="olist">${hechos.map(ocard).join("")}</div></section>`:""}
    ${error?`<div class="encargo">${IC.box}<span>Sin conexión. Mostramos lo último que vimos; se actualiza solo cuando vuelva el internet.</span></div>`:""}
    ${cargando?`<div class="empty-c"><span class="pulse" style="width:12px;height:12px"></span><p>Cargando…</p></div>`:""}
    ${!lista.length&&!cargando?`<div class="empty-c">${IC.box}<b>Aún no tienes pedidos</b><p>Cuando hagamos tu pedido en Temu aparece aquí con su seguimiento, paso a paso.</p></div>`:""}
    <section><h2 class="sec-t">${contactos.length>1?"Escríbenos":"Tu contacto"}</h2>
      ${contactos.map(k=>`<div class="contact" style="margin-bottom:10px"><div class="av">${EQUIPO[k].nombre[0]}</div><b>${EQUIPO[k].nombre} · DC Marketing</b><span class="num">${fmtTel(EQUIPO[k].tel)}${cp(EQUIPO[k].tel,"teléfono")}</span>
        <div class="row"><a class="btn wa" href="${waLink(k,`Hola ${EQUIPO[k].nombre}, soy ${r.nombre} ${r.apellido}. Te escribo desde la app de DC Marketing.`)}" target="_blank" rel="noopener">Escribir por WhatsApp</a></div></div>`).join("")}
    </section>
    <div class="foot"><button class="linkbtn" data-salir>¿No eres ${esc(r.nombre)}? Cambiar nombre</button><a class="linkbtn" href="#codigo">Buscar por código</a></div>
    <p class="note" style="text-align:center">Versión ${APP_VERSION} · <button class="linkbtn" data-novedades>Novedades</button></p>
  </main></div>`;
}

/* ---------- Seguimiento de un pedido ---------- */
function rutaSVG(i){
  // 4 hitos sobre una curva: China → Vuelo → Panamá → Tu puerta
  const pts=[[24,98],[150,40],[262,70],[372,26]];
  const hito=[0,0,0.5,1.4,2,2.2,2.5,2.8,3]; // hasta qué hito llegó según la etapa
  const labels=["China","En vuelo","Panamá","Tu puerta"];
  return `<svg viewBox="0 0 396 130" role="img" aria-label="Ruta del paquete: ${CORTO[i]}">
    <path d="${RUTA}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2" stroke-dasharray="3 6"/>
    <path id="trail" d="${RUTA}" fill="none" stroke="var(--signal)" stroke-width="3" stroke-linecap="round"/>
    ${pts.map((p,k)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${k<=hito[i]?5:4}" fill="${k<=hito[i]?'var(--signal)':'var(--navy-2)'}" stroke="${k<=hito[i]?'var(--signal)':'rgba(255,255,255,.35)'}" stroke-width="2"/>
      <text class="lbl ${k<=hito[i]?'on':''}" x="${p[0]}" y="${p[1]+(k%2?-14:22)}" text-anchor="${k===0?'start':k===3?'end':'middle'}">${labels[k]}</text>`).join("")}
    <g id="pkg">${PKG}</g>
  </svg>`;
}
function animarRuta(i){
  const path=document.getElementById("trail"),pkg=document.getElementById("pkg");if(!path)return;const L=path.getTotalLength();
  const fin=L*[.02,.06,.16,.42,.66,.7,.76,.88,1][i];
  path.style.strokeDasharray=L;
  const set=v=>{path.style.strokeDashoffset=L-v;const p=path.getPointAtLength(v);pkg.setAttribute("transform",`translate(${p.x} ${p.y})`)};
  if(reduce()){set(fin);return}
  const t0=performance.now(),dur=1400;
  (function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);set(fin*e);if(k<1)requestAnimationFrame(f)})(t0);
}
function pista(v,k){if(k===7&&v.envio)return`Va por ${v.envio.t}${v.prov?` hacia ${v.prov}`:""}`;return ESTADOS[k][1]}
async function seguimiento(code){
  vistaActual="seguimiento";
  let v=(MIS?.pedidos||[]).find(x=>x&&x.code===code),fallo=false;
  if(!v){app.innerHTML=`<div class="enter pad grid-bg"><div class="mark" style="position:relative;z-index:1"><img src="${LOGO}" alt="">DC MARKETING</div><h1>Buscando tu <em style="font-style:normal;color:var(--signal)">pedido</em>…</h1><p><span class="pulse" style="display:inline-block"></span> ${esc(code)}</p></div>`;
    try{v=await rpc("app_seguimiento",{p_codigo:code})}catch(e){fallo=true}
    if(decodeURIComponent(location.hash.slice(1)).toUpperCase()!==code)return}
  if(!v)return pantallaCodigo(fallo?"No pudimos conectarnos. Revisa tu internet e intenta de nuevo.":`No encontramos el código ${code.replace(/[^A-Z0-9-]/g,"")}. Revisa el mensaje o escríbenos.`);
  const i=v.i,quien=EQUIPO[v.quien]||EQUIPO.diego,entregado=i===8,r=miRegistro();
  const titular=entregado?`¡Tu paquete <em>llegó</em>!`:i===7?(v.envio?`Tu paquete va <em>camino a ti</em>`:`Estamos <em>preparando</em> tu entrega`):i===6?`Recibido por <em>DC Marketing</em>`:i>=4?`Tu paquete ya está <em>en Panamá</em>`:i===3?`Tu paquete va <em>en vuelo</em>`:`Tu pedido está <em>en marcha</em>`;
  let varios="";if(v.paq.length>1&&i<6){const mx=Math.max(...v.paq),n=v.paq.filter(x=>x===mx).length;varios=`<div class="last">${n} de ${v.paq.length} paquetes: ${ESTADOS[mx-1][0].toLowerCase()}</div>`}
  const wa=`https://wa.me/507${quien.tel}?text=${encodeURIComponent(`Hola ${quien.nombre}, consulto por mi pedido ${code}.`)}`;
  app.innerHTML=`
  <header class="hero pad grid-bg">
    <div class="brand"><div class="mark"><img src="${LOGO}" alt="">DC MARKETING</div><button class="code-chip" id="volver" aria-label="${r?"Volver a mis pedidos":"Buscar otro pedido"}">${r?"← Mis pedidos":code}</button></div>
    <div class="greet"><p>Hola, ${esc(r?r.nombre:v.nombre)} · <span style="font-family:var(--f-mono)">${code}</span>${cp(code)}</p><h1>${titular}</h1>
      <div class="last"><span class="pulse"></span>${CORTO[i]} · ${hace(v.h[i])}</div>${varios}</div>
    <div class="route">${rutaSVG(i)}</div>
  </header>
  <main class="sheet pad ${entregado?"delivered":""}">
    <section><h2 class="sec-t">Recorrido</h2>
      <ol class="steps">${ESTADOS.map((e,k)=>`<li class="${k<i?"done":k===i?"now done":""}">
        <span class="n">${k<i?"✓":k+1}</span><div><div class="t">${e[0]}</div>${k===i?`<div class="h">${esc(pista(v,k))}</div>`:""}</div>
        <span class="when">${v.h[k]?dia(v.h[k]):""}</span></li>`).join("")}</ol>
    </section>
    <section><h2 class="sec-t">Tu contacto</h2>
      <div class="contact"><div class="av">${quien.nombre[0]}</div><b>${quien.nombre} · DC Marketing</b><span class="num">${fmtTel(quien.tel)}${cp(quien.tel,"teléfono")}</span>
        <div class="row"><a class="btn wa" href="${wa}" target="_blank" rel="noopener">Escribir por WhatsApp</a></div></div>
    </section>
    <p class="note">Las fechas se actualizan automáticamente con el rastreo de la paquetería. Los tiempos pueden variar en aduana.</p>
  </main>`;
  $("#volver").onclick=()=>{if(r){history.replaceState(null,"",location.pathname+location.search);inicio()}else location.hash="codigo"};
  requestAnimationFrame(()=>animarRuta(i));
}

/* ---------- Buscar por código ---------- */
function pantallaCodigo(msg){
  vistaActual="codigo";const r=miRegistro();
  app.innerHTML=`<div class="enter pad grid-bg">
    <button class="back" id="atras">← ${r?"Mis pedidos":"Entrar con mi nombre"}</button>
    <div class="mark" style="position:relative;z-index:1"><img src="${LOGO}" alt="">DC MARKETING</div>
    <h1>¿Dónde está mi pedido?</h1>
    <p>Escribe el código que te llegó por WhatsApp.</p>
    <form id="f" style="position:relative;z-index:1"><input id="code" placeholder="DC-0000" aria-label="Código de pedido" autocomplete="off"><button class="btn" type="submit">Buscar</button></form>
    ${msg?`<p class="err">${esc(msg)}</p>`:""}
  </div>`;
  $("#f").onsubmit=e=>{e.preventDefault();ir($("#code").value)};
  $("#atras").onclick=()=>{history.replaceState(null,"",location.pathname+location.search);ruta()};
}
function ir(v){const c=String(v).trim().toUpperCase().replace(/^(DC)?-?(\d{4})$/,"DC-$2");if(location.hash.slice(1)===c)ruta();else location.hash=c}

/* ---------- Navegación ---------- */
function ruta(){
  const h=decodeURIComponent(location.hash.slice(1)).toUpperCase();
  if(/^DC-/.test(h))return seguimiento(h);
  if(h==="CODIGO")return pantallaCodigo();
  if(miRegistro())return inicio();
  bienvenida();
}
addEventListener("hashchange",()=>{ruta();scrollTo({top:0})});
app.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
  if("instalar" in t.dataset&&bip){bip.prompt();bip.userChoice.finally(()=>{bip=null;inicio()})}
  else if("tipx" in t.dataset){escribir(K_TIP,1);inicio()}
  else if("salir" in t.dataset){if(confirm("¿Entrar con otro nombre en este teléfono?")){try{localStorage.removeItem(K_YO)}catch(_){}bienvenida()}}
});
// Si DC vincula tu registro mientras tienes la app abierta (mismo navegador en el prototipo), se actualiza sola.
// Se actualiza sola: al volver a la app y cada minuto mientras ves tus pedidos.
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&vistaActual==="inicio")refrescarMis(true)});
setInterval(()=>{if(document.visibilityState==="visible"&&vistaActual==="inicio")refrescarMis(true)},60000);
/* ---------- Actualizaciones ----------
   version.json (en la raíz del sitio) dice la última versión de cada app y sus novedades.
   Si es mayor que APP_VERSION aparece "Nueva actualización". Al publicar un cambio: subir APP_VERSION
   en el HTML que cambió y poner el mismo número y la nota en version.json. */
const APP="cliente",APP_VERSION=7;
const ACT={v:null,hay:false};
const espera=ms=>new Promise(r=>setTimeout(r,ms));
const ICO_OK=`<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
async function leerVersion(){try{const r=await fetch(new URL("../version.json?t="+Date.now(),location.href),{cache:"no-store"});return r.ok?await r.json():null}catch(e){return null}}
/* Novedades para esta app: el admin ve lo suyo y lo de los clientes; el cliente solo lo suyo. */
function notas(v,desde,hasta){return(v?.notas||[]).filter(n=>(n[APP]||0)>desde&&(n[APP]||0)<=hasta).map(n=>({...n,lista:APP==="admin"
  ?[...(n.admin_items||[]).map(t=>({t,de:"Panel"})),...(n.cliente_items||[]).map(t=>({t,de:"Clientes"}))]:(n.cliente_items||[]).map(t=>({t}))})).filter(n=>n.lista.length)}
async function revisarAct(){const v=await leerVersion();if(!v)return;ACT.v=v;ACT.hay=(v[APP]||0)>APP_VERSION;
  const p=document.getElementById("act-pill");if(p)p.hidden=!ACT.hay;document.body.classList.toggle("hay-act",ACT.hay)}
function cerrarUpd(){document.getElementById("upd")?.remove()}
function hojaUpd({k,titulo,lista,botones}){cerrarUpd();const d=document.createElement("div");d.className="upd";d.id="upd";
  d.innerHTML=`<div class="upd-bg" data-updx></div><div class="upd-sheet" role="dialog" aria-modal="true" aria-labelledby="upd-t"><div class="upd-grab"></div>
    <p class="upd-k">${k}</p><h2 id="upd-t">${titulo}</h2>
    ${lista.length?lista.map(n=>`<div class="upd-nota"><div><b>${esc(n.titulo||"Mejoras")}</b><br><small>${n.fecha?new Date(n.fecha+"T12:00").toLocaleDateString("es-PA",{day:"numeric",month:"long",year:"numeric"}):""}</small></div>
      <ul>${n.lista.map(x=>`<li><span>${x.de?`<span class="upd-tag ${x.de==="Clientes"?"cli":""}">${x.de}</span>`:""}${esc(x.t)}</span></li>`).join("")}</ul></div>`).join("")
      :`<div class="upd-nota"><small>${ACT.v?"No hay notas para mostrar.":"No se pudo revisar ahora. Revisa tu conexión e intenta de nuevo."}</small></div>`}
    <div class="upd-btns">${botones}</div></div>`;
  document.body.appendChild(d);d.querySelector(".upd-btn")?.focus({preventScroll:true})}
async function abrirNovedades(){if(!ACT.v)await revisarAct();const v=ACT.v;
  if(ACT.hay)hojaUpd({k:"Nueva actualización",titulo:`La versión ${v[APP]} está lista`,lista:notas(v,APP_VERSION,v[APP]),
    botones:`<button class="upd-btn" data-updgo>Actualizar ahora</button><button class="upd-btn sec" data-updx>Después</button>`});
  else hojaUpd({k:"Novedades",titulo:`Tienes la versión ${APP_VERSION}, la más reciente`,lista:notas(v,APP_VERSION-3,APP_VERSION),botones:`<button class="upd-btn sec" data-updx>Cerrar</button>`})}
function destinoAct(n){const u=new URL(location.href);u.searchParams.set("v",n);return u.href}
async function actualizar(){cerrarUpd();
  const L=document.createElement("div");L.className="upd-load";L.setAttribute("role","status");
  L.innerHTML=`<img src="${LOGO}" alt=""><h2>Actualizando</h2><div class="upd-bar"><i></i></div>
    <ol class="upd-pasos"><li><span></span>Buscando la nueva versión</li><li><span></span>Descargando la actualización</li><li><span></span>Instalando</li></ol>
    <p class="upd-msg">Tus datos no se pierden.</p>`;
  document.body.appendChild(L);const pasos=L.querySelectorAll("li"),bar=L.querySelector(".upd-bar i");
  const paso=async(i,fn,min)=>{pasos[i].className="on";bar.style.width=(i*33+12)+"%";const t0=Date.now(),r=await fn();await espera(Math.max(0,min-(Date.now()-t0)));pasos[i].className="ok";pasos[i].firstChild.innerHTML="✓";bar.style.width=((i+1)*33.4)+"%";return r};
  const falla=(t,txt)=>{L.innerHTML=`<img src="${LOGO}" alt=""><h2>${t}</h2><p class="upd-msg">${txt}</p><button class="upd-btn" style="min-width:200px">Cerrar</button>`;L.querySelector("button").onclick=()=>L.remove()};
  const v=await paso(0,leerVersion,800);const n=v?.[APP];
  if(!n)return falla("Sin conexión","No pudimos revisar la actualización. Revisa tu internet e intenta de nuevo.");
  if(n<=APP_VERSION){L.remove();return revisarAct()}
  const lista=await paso(1,async()=>{try{const r=await fetch(destinoAct(n),{cache:"reload"});return(await r.text()).includes(`APP_VERSION=${n};`)}catch(e){return false}},1200);
  if(!lista)return falla("Casi lista","La actualización todavía se está publicando. Intenta de nuevo en uno o dos minutos.");
  await paso(2,()=>{try{localStorage.setItem("dc-actualizado-"+APP,APP_VERSION+">"+n)}catch(e){}},900);
  L.innerHTML=`<div class="upd-fin">${ICO_OK}</div><h2>¡Listo!</h2><p class="upd-msg">Abriendo la versión ${n}…</p>`;
  await espera(900);location.replace(destinoAct(n))}
/* Al abrir después de actualizar: mostrar lo que trae la versión nueva */
async function avisoActualizado(){let k=null;try{k=localStorage.getItem("dc-actualizado-"+APP)}catch(e){}if(!k)return;
  const[de,a]=k.split(">").map(Number);if(a!==APP_VERSION)return;try{localStorage.removeItem("dc-actualizado-"+APP)}catch(e){}
  await revisarAct();hojaUpd({k:"Actualización completa",titulo:`¡Ya tienes la versión ${APP_VERSION}!`,lista:notas(ACT.v,de,APP_VERSION),botones:`<button class="upd-btn" data-updx>Entendido</button>`})}
document.addEventListener("click",e=>{const t=e.target.closest("[data-updx],[data-updgo],[data-novedades]");if(!t)return;e.preventDefault();
  if("updx" in t.dataset)cerrarUpd();else if("updgo" in t.dataset)actualizar();else abrirNovedades()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")cerrarUpd()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")revisarAct()});
setInterval(revisarAct,10*60*1000);
revisarAct().then(avisoActualizado);
ruta();
</script>
